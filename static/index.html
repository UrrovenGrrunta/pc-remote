<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PC Remote</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="remote">
        <header class="remote__header">
            <p class="remote__eyebrow">Windows PC</p>
            <h1>Game Library</h1>
        </header>

        <section class="game-grid">
            <button id="cs2-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/730/header.jpg"
                    alt="Counter-Strike 2"
                >
                <span>ПЖ ЗАГЕРАЙ 2</span>
            </button>

            <button id="ets_2-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/227300/header.jpg"
                    alt="Euro Truck Simulator 2"
                >
                <span>ETS 2</span>
            </button>

            <button id="TBOI-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/250900/header.jpg"
                    alt="The Binding of Isaac: Rebirth"
                >
                <span>TBOI</span>
            </button>

            <button id="cloverpit-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/3314790/header.jpg"
                    alt="CloverPit"
                >
                <span>CloverPit</span>
            </button>

            <button id="starrupture-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1631270/header.jpg"
                    alt="StarRupture"
                >
                <span>StarRupture</span>
            </button>

            <button id="phasmo-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/739630/header.jpg"
                    alt="Phasmophobia"
                >
                <span>Phasmophobia</span>
            </button>

            <button id="satisfactory-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/526870/header.jpg"
                    alt="Satisfactory"
                >
                <span>Satisfactory</span>
            </button>

            <button id="passport_blyat-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/239030/header.jpg"
                    alt="Papers, Please"
                >
                <span>Passport Blyat</span>
            </button>

            <button id="gd-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/322170/header.jpg"
                    alt="Geometry Dash"
                >
                <span>GD</span>
            </button>

            <button id="creepy_support-button" class="game-card">
                <img
                    src="/images/header.jpg"
                    alt="Creepy Support"
                >
                <span>Creepy Support</span>
            </button>

            <button id="graveyard_keeper-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/599140/header.jpg"
                    alt="Graveyard Keeper"
                >
                <span>Graveyard Keeper</span>
            </button>

            <button id="everlasting_summer-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/331470/header.jpg"
                    alt="Everlasting Summer"
                >
                <span>Everlasting Summer</span>
            </button>

            <button id="vcd_shadow_warrior-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/255520/header.jpg"
                    alt="Viscera Cleanup Detail: Shadow Warrior"
                >
                <span>VCD: Shadow Warrior</span>
            </button>

            <button id="deep_rock_galactic-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/548430/header.jpg"
                    alt="Deep Rock Galactic"
                >
                <span>Deep Rock Galactic</span>
            </button>

            <button id="vcd_santas_rampage-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/265210/header.jpg"
                    alt="Viscera Cleanup Detail: Santa's Rampage"
                >
                <span>VCD: Santa's Rampage</span>
            </button>

            <button id="vcd-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/246900/header.jpg"
                    alt="Viscera Cleanup Detail"
                >
                <span>Viscera Cleanup Detail</span>
            </button>

            <button id="ADOFAI-button" class="game-card">
                <img
                    src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/977950/header.jpg"
                    alt="A Dance of Fire and Ice"
                >
                <span>ADOFAI</span>
            </button>
            <button id="osu-button" class="game-card">
                <img src="/images/osu.jpg" alt="osu!">
                <span>osu!</span>
            </button>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
